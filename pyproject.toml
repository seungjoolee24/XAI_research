[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-truth-xai"
version = "0.1.0"
description = "Milestone 1: reproducible Qwen3 sycophancy baseline and hidden-state inspection"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6,<3",
  "transformers==4.57.6",
  "accelerate>=1.2,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6", "pypdf>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
truthgate = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
